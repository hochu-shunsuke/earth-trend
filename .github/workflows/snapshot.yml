name: snapshot

# 注意の時系列をUpstashに蓄積する。コストゼロ運用のためVercel Cron(無料は1日1回)でなくGitHub Actionsを使う。
on:
  schedule:
    # 30分ごと。Actionsは1ジョブを分単位で切り上げ課金するため、15分(96回/日=最低96分/日)は
    # PRIVATEリポの無料枠2000分/月を超える。30分(48回/日)×1分未満ジョブ ≈ 1440分/月で収まる。
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # 手動実行も可

# 同時実行を防ぐ(遅延で重なった場合は新しい方を優先)
concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-nodeは省く: ubuntu-latestのシステムNode(20+, 組み込みfetch有)で動く。
      # node導入の~20-30秒を削り、1ジョブを確実に1分未満(=1分課金)に収めるため。
      - run: node cosmos/scripts/snapshot.mjs
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
